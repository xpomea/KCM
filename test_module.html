<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тест WASM-функции sort_std</title>
  <script src="test_module.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 8px 16px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Тест функции <code>sort_std()</code> из WASM</h1>
  <button id="run-btn">Запустить sort_std()</button>
  <pre id="output"></pre>

  <script>
    Module.onRuntimeInitialized = () => {
      const sortStd = Module.cwrap('sort_std', 'number', []);
      const bubble = Module.cwrap('bubble', 'number', []);
      const outputElement = document.getElementById('output');

      document.getElementById('run-btn').addEventListener('click', () => {
        outputElement.textContent = 'init\n';

        // Function to append text to the output element
        const logToOutput = (text) => {
          outputElement.textContent += text + '\n';
        };

        // If test_module.js uses console.log, redirect it
        const origLog = console.log;
        //console.log = (...args) => {
          //logToOutput(args.join(' '));
          //origLog.apply(console, args);
        //};

        // If test_module.js uses Module.print or Module.printErr, redirect them
        const origPrint = Module.print || (() => {});
        const origPrintErr = Module.printErr || (() => {});

        Module.print = (text) => {
          logToOutput(text);
          origPrint(text);
        };

        Module.printErr = (text) => {
          logToOutput(text);
          origPrintErr(text);
        };

        //sortStd();
        bubble();


        // Restore original functions
        console.log = origLog;
        Module.print = origPrint;
        Module.printErr = origPrintErr;
      });
    };
  </script>
</body>
</html>
