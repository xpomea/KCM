<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WASM in Web Worker</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 8px 16px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <h1>WASM in Web Worker</h1>
  <button id="run-btn">Run sort_std() in Worker</button>
  <pre id="output">...</pre>

  <script>
    const runBtn = document.getElementById('run-btn');
    const outputEl = document.getElementById('output');

    const worker = new Worker('worker.js'); // Worker script

    worker.onmessage = function(e) {
      if (e.data.type === 'log') {
        outputEl.textContent += e.data.message + '\n';
      } else if (e.data.type === 'result') {
        outputEl.textContent += `Result: ${e.data.message}\n`;
      }
    };

    runBtn.onclick = function() {
      outputEl.textContent = 'Starting...\n';
      worker.postMessage({ type: 'run' }); // Signal worker to run sort_std()
    };
  </script>
</body>
</html>
